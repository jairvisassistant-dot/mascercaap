            - paragraph [ref=e41]: "Más Cerca AP no es solo un negocio: es un regalo de Dios, y la prueba viva de que los nuevos comienzos existen. Fue fundada por una pareja que creyó que servir a la gente era la mejor forma de emprender. Producimos y comercializamos zumos de frutas, pulpas de frutas y productos frescos de origen directo, comprando a los campesinos en la finca y siendo la plataforma que lleva sus productos a hogares, negocios y nuevos mercados. Nos mueve la fe en Dios, nos guía la honestidad y nos define el compromiso con el campo colombiano."
