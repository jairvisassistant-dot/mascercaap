name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  # ── Validate: build + test in CI before touching production ─────────────────
  validate:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build main app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

  # ── Deploy: SSH into Hostinger, pull & rebuild ──────────────────────────────
  deploy:
    name: Deploy to Production
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: 65002
          script: |
            set -e
            export NODE_OPTIONS="--max-old-space-size=512"

            echo "── Deploying unified app ───────────────────────"
            cd ${{ secrets.MAIN_APP_PATH }}
            git pull origin main

            # Security: install with lifecycle scripts DISABLED so no dependency can
            # execute arbitrary code next to this app's production secrets. Exactly
            # four packages in package-lock.json declare install scripts (esbuild,
            # sharp, unrs-resolver, supabase) and are re-enabled explicitly below,
            # so build/runtime behaviour is unchanged.
            npm ci --include=dev --ignore-scripts
            npm rebuild esbuild sharp unrs-resolver supabase

            npm run build
            touch tmp/restart.txt
            echo "✓ App rebuilt and restarted"
